<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      확대를 막지 않는다.
      아이가 연타할 때 화면이 확대되는 건 body의 `touch-action: manipulation`이
      이미 막고 있다(더블탭 줌 차단). user-scalable=no까지 걸면 그 부작용은 없고
      저시력 사용자와 보호자가 손가락으로 키워 볼 수단만 사라진다.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FEF4F8" />
    <meta name="application-name" content="키크" />
    <meta name="apple-mobile-web-app-title" content="키크" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="나만의 키캡에 그림과 소리를 담아 15초 공연을 만드는 키크 창작 놀이터"
    />
    <link rel="canonical" href="https://keyc-studio.web.app/" />
    <title>키크 — 나만의 키캡으로 만드는 15초 공연</title>

    <!--
      /w/** 는 Hosting rewrite로 shareMeta 함수가 가로채 OG 태그가 박힌 HTML을 준다.
      아래 기본값은 그 외 경로(홈 등)에서 쓰인다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="키크" />
    <meta property="og:title" content="키크 — 나만의 키캡으로 만드는 15초 공연" />
    <meta
      property="og:description"
      content="나만의 키캡에 그림과 소리를 담고, 15초 공연으로 만들어 공유해 보세요."
    />
    <meta property="og:url" content="https://keyc-studio.web.app/" />
    <meta property="og:image" content="https://keyc-studio.web.app/og-default.jpg" />
    <meta property="og:image:secure_url" content="https://keyc-studio.web.app/og-default.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="빛나는 네 개의 키캡으로 만든 키크 공연" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="키크 — 나만의 키캡으로 만드는 15초 공연" />
    <meta
      name="twitter:description"
      content="나만의 키캡에 그림과 소리를 담고, 15초 공연으로 만들어 공유해 보세요."
    />
    <meta name="twitter:image" content="https://keyc-studio.web.app/og-default.jpg" />
    <meta name="twitter:image:alt" content="빛나는 네 개의 키캡으로 만든 키크 공연" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
